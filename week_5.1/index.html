<!DOCTYPE html>
<html>

<head>
    <title>week5 - form Page</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-sky-200 ">
    <div class="flex justify-center w-screen h-screen">
        <div class="bg-blue-50 w-1/3 p-3 m-4 rounded-lg">ซื้อเกม
            <h1 class="text-center font-bold text-2xl">เว็บขายเกมอันดับ1</h1>
            <p class="text-sm text-center">โหด ตึง คม</p>
            <form>
                <div class="mt-10 p-3">
                    <p>โปรไฟล์</p>
                    <p>ชื่อ</p>
                    <input type="text" placeholder="กรุณาระบุชื่อ">
                </div>
                <div class="mt-10 p-3">
                    <p>นามสกุล</p>
                    <input type="text" placeholder="กรุณาระบุนามสกุล">
                </div>
                <div class="mt-10 p-3">
                    <p>e-mail</p>
                    <input type="text" placeholder="กรุณาระบุ e-mail">
                </div>
                <div class="mt-10 p-3">
                    <p>เลือกเกมที่อยากได้</p>
                    <select class="select">
                        <option class="bg-sky-200">กรุณาเลือกเกม</option>
                        <option class="bg-lime-300">Overwatch2 ฟรี</option>
                        <option class="bg-amber-300">Kingdom Come: Deliverance II ราคา1699บาท</option>
                        <option class="bg-orange-300">33 Immortals ราคา2499บาท</option>
                        <option class="bg-cyan-300">r.e.p.o ราคา200บาท</option>
                        <option class="bg-indigo-300">minegay ราคา699บาท</option>
                        <option class="bg-indigo-200">dead by daylight ราคา300บาท</option>
                    </select>
                </div>
                <div class="mt-10 p-3">
                    <fieldset class="fieldset">
                        <legend class="fieldset-legend">ขอความช่วยเหลือ</legend>
                        <textarea class="textarea h-24" placeholder="ช่วยเหลือ"></textarea>
                        <div class="label">ติดต่อเจ้าหน้าที่</div>
                    </fieldset>
                </div>
                <div class="mt-10 p-3 text-center"><button class="btn btn-active btn-primary">ยืนยันคำสั่งซื้อ</button>
                </div>
                <div class="bg-blue-500 mt-10 p-3"><span class="text-rotate text-7xl duration-6000">
                        <span class="justify-items-center">
                            <span>เกมดีนะน้อง</span>
                            <span class="font-bold italic px-2">ซื้อเลย ▶︎▶︎</span>
                        </span>
                    </span></div>

            </form>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
