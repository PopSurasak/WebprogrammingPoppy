<!DOCTYPE html>
<html>

<head>
    <title>ทดสอบ Web Event</title>
    <style>
        body {
            background-color:#90EDF9
;
            text-align: center;
            font-size: 30px;
        }
        Input {
            height: 40px;
            width: 500px;
            border-radius: 10px;
        }
        h2{
            color: blueviolet;
            font-size: 30px;
        }
        p{
            color: blue;
        }
        select{
            font-size: 25px;
            
        }
    </style>
</head>
<body>
<h2>ทดสอบการอ่านชื่อจาก Input</h2>
<p id="show-msg">อ่านข้อความ: </p>
<Input id = "msg.Input"placeholder="กรุณากรอกข้อความ" type="text">
<h2>ทดสอบการเลือกแบบselect</h2>

<select id="select.input">
    <option>โปรดเลือกตัวเลือก</option>
    <option>ตัวเลือกที่1</option>
    <option>ตัวเลือกที่2</option>
    <option>ตัวเลือกที่3</option>
</select>
<p id="nigga.56">: </p>
    <script>
        const msgInputElement = document.getElementById("msg.Input")
        msgInputElement.addEventListener("input",function(){
            const msg = this.value
            const showMsgElement = document.getElementById("show-msg")
            showMsgElement.innerText =''+msg//'ข้อความที่อ่านได้+msg อันนี้คือ default'
        })

        const msgSelectElement = document.getElementById("select.input")
        msgSelectElement.addEventListener("input",function(){
            const msg = this.value
            const showMsgElement = document.getElementById("nigga.56")
            showMsgElement.innerText='ข้อความที่อ่าน: '+ msg
        })
    </script>
</body>

</html>
