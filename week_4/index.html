<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>อะไรสักอย่างนีแหละ</title>
        <link rel="stylesheet" href="./style.css">
    </head>
    <style>
    </style>
    <body>
        <h1 id="greeting">คุณชื่ออะไร</h1>
        <div>
            <button onclick="showUserName()">แสดงรายชื่อผู้ใช้</button> 
            <button onclick="reload()">รีเฟรชหน้าต่าง</button>
            <button onclick="OpenNewWindow()">เปิดหน้าต่างใหม่</button>
            <!-- functionต้องมีวงเล็บด้วย -->
        </div>
        <script>

            function showUserName() {
                const userAgent = navigator.userAgent;
                const language = navigator.language;
                const width = screen.width;
                const height = screen.height;
                alert('ข้อมูลผู้ใช้:\nUser Agent: ${userAgent}\nLanguage: ${language}\nScreen Width: ${width}\nScreen Height: ${height}');
            }
            function reload() {
                window.location.reload();
            }
            function OpenNewWindow() {
                window.open("https://example.com")
            }

        </script>
    </body>
</html>
