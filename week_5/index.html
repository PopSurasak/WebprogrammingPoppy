<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>week5 - Form Page</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <div class="flex justify-center w-screen h-screen">
        <div class="bg-white w-1/3 p-3 m-4 rounded-lg">อุอิอาอุอิอาอุอิ
            <h1 class="bg-sky-200 text-center font-bold text-2xl">แบบฟอร์มลงทะเบียนเรียน</h1>
            <p class="text-sm text-center">สำหรับนักศึกษา คณะบริหารธุระกิจ สาขาวิชานวัฒกรรมสารสนเทศ</p>
            <form style="z-index: -9;">
                <div class="mt-10 p-3">
                    <p>ชื่อ</p>
                    <input type="text" placeholder="กรุณาระบุชื่อนักศึกษา">
                </div>
                <div class="mt-10 p-3">
                    <p>นามสกุล</p>
                    <input type="text" placeholder="กรุณาระบุนามสกุล">
                </div>
                <div class="mt-10 p-3">
                    <p>รหัสนักศึกษา</p>
                    <input type="text" placeholder="กรุณาระบุรหัสนักศึกษา">
                </div>
                <div class="mt-10 p-3">
                    <p>เลือกวิชา</p>
                    <select class="select">
                        <option disabled selected>กรุณาเลือกวิชา</option>
                        <option>ฺBasic Programing</option>
                        <option>Advancend Programing</option>
                        <option>Web Programing</option>
                    </select>
                </div>
                <div class="mt-10 p-3"><textarea class="textarea" placeholder="หมายเหตุ"></textarea></div>
                <div class="mt-10 p-3 text-center"><button class="btn btn-neutral">ส่งแบบฟอร์ม</button></div>
            </form>
        </div>
    </div>
    <script src="./script.js"></script>
</body>

</html>
